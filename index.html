<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil 1 Rally Championship (1999) - Browser Edition v1.0.5</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { font-size: 22px; color: #00d2ff; margin-bottom: 5px; }
        p { color: #aaa; margin-top: 0; margin-bottom: 15px; font-size: 14px; }
        #screen-container {
            width: 800px;
            height: 600px;
            border: 5px solid #444;
            background: black;
            border-radius: 4px;
        }
        #canvas { display: block; width: 100%; height: 100%; }
        .btn-avvia {
            background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
            border: none;
            color: white;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 15px;
        }
        .btn-avvia:hover { transform: translateY(-2px); }
        .btn-avvia:disabled { background: #444; cursor: not-allowed; transform: none; }
        .controls { margin-top: 15px; font-size: 14px; color: #ccc; }
        .status { font-size: 13px; color: #00ffcc; margin-bottom: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <h1>🏁 La Mia Libreria: Mobil 1 Rally Championship (1999) - Build v1.0.5</h1>
    <p>Esecuzione nativa tramite WebAssembly & WebGL</p>
    
    <button class="btn-avvia" id="btnStart">AVVIA GIOCO</button>
    <div id="statusMessage" class="status">In attesa dell'avvio manuale...</div>

    <div id="screen-container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <div class="controls">
        Fai clic nel riquadro per bloccare il mouse. Premi <b>Esc</b> per sbloccarlo.
    </div>

    <!-- SBLOCCO CORS: Carichiamo prima il file JS locale in modo standard e lineare -->
    <script src="boxedwine.js"></script>

    <script>
        const btnStart = document.getElementById('btnStart');
        const statusMessage = document.getElementById('statusMessage');

        btnStart.addEventListener('click', function() {
            btnStart.disabled = true;
            statusMessage.innerText = "Inizializzazione dei moduli e avvio del download (517 MB)...";

            // Sostituisci questo URL con il link REALE delle tue GitHub Releases
            const giocoUrl = "https://github.com";

            // Configurazione della sandbox Emscripten isolata
            var ConfigBoxedwine = {
                wasm_path: "boxedwine.wasm", 
                canvas: document.getElementById("canvas"),
                app: giocoUrl,
                p: "d:/ral.exe"
            };

            // Agganciamo i parametri direttamente all'oggetto globale prima dell'esecuzione del binario
            window.BoxedwineConfig = ConfigBoxedwine;

            // Sovrascriviamo l'inizializzazione del File System per impedire a boxedwine.js 
            // di effettuare chiamate esterne verso jsdelivr
            if (typeof Module !== "undefined") {
                Module.canvas = ConfigBoxedwine.canvas;
                Module.arguments = ["-root", "boxedwine.zip", "-app", ConfigBoxedwine.app, "-hda", "d", "d:/ral.exe"];
                Module.locateFile = function(path) {
                    if (path.endsWith(".wasm")) return "boxedwine.wasm";
                    return path;
                };
            }

            try {
                // Avvio diretto saltando i controlli di rete remoti
                if (typeof Boxedwine !== "undefined" && typeof Boxedwine.start === "function") {
                    Boxedwine.start(ConfigBoxedwine);
                } else if (typeof Module.run === "function") {
                    Module.run();
                } else {
                    // Se la libreria richiede forzatamente l'altro file, lo indichiamo nello stato
                    statusMessage.innerText = "Caricamento core avviato. Controlla la console (F12) per verificare i log.";
                }
            } catch (e) {
                statusMessage.innerText = "Eccezione rilevata: " + e.message;
                btnStart.disabled = false;
            }
        });
    </script>
</body>
</html>
