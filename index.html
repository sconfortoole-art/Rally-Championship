<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 98 & Rally Championship - Browser Edition</title>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { font-size: 20px; color: #00d2ff; margin-bottom: 10px; }
        #screen-container {
            width: 800px;
            height: 600px;
            border: 5px solid #444;
            background: black;
        }
        #screen-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .controls { margin-top: 15px; font-size: 14px; color: #ccc; }
    </style>
</head>
<body>

    <h1>🖥️ La Mia Libreria: Windows 98 & Rally Championship</h1>
    
    <div id="screen-container"></div>

    <div class="controls">
        Fai clic nel riquadro per bloccare il mouse. Premi <b>Esc</b> per sbloccarlo.
    </div>

    <!-- Usiamo il server unpkg al posto di jsDelivr per evitare i blocchi di connessione -->
    <script defer src="https://unpkg.com"></script>

    <script>
        window.addEventListener("load", function() {
            if (typeof V86Starter === "undefined") {
                console.log("In attesa del motore v86...");
                setTimeout(startEngine, 1000);
            } else {
                startEngine();
            }
        });

        function startEngine() {
            if (typeof V86Starter === "undefined") {
                setTimeout(startEngine, 500);
                return;
            }

            const idDrive = "1L2YcHrQt9c2rQY284gy8CeGBXi41IPJa";
            const discoUrl = "https://google.com" + idDrive;

            var emulator = new V86Starter({
                wasm_path: "https://unpkg.com",
                memory_size: 128 * 1024 * 1024, 
                vga_memory_size: 8 * 1024 * 1024, 
                screen_container: document.getElementById("screen-container"),
                bios: { url: "https://unpkg.com" },
                vga_bios: { url: "https://unpkg.com" },
                hda: { url: discoUrl }, 
                autostart: true,
            });
        }
    </script>
</body>
</html>
