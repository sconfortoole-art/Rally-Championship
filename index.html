<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil 1 Rally Championship (1999) - Browser Edition</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { 
            font-size: 22px; 
            color: #00d2ff; 
            margin-bottom: 5px; 
        }
        p {
            color: #aaa;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 14px;
        }
        #screen-container {
            width: 800px;
            height: 600px;
            border: 5px solid #444;
            background: black;
            border-radius: 4px;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .btn-avvia {
            background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
            border: none;
            color: white;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 15px;
        }
        .btn-avvia:hover {
            transform: translateY(-2px);
        }
        .btn-avvia:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }
        .controls { 
            margin-top: 15px; 
            font-size: 14px; 
            color: #ccc; 
        }
        .status {
            font-size: 13px;
            color: #00ffcc;
            margin-bottom: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>🏁 La Mia Libreria: Mobil 1 Rally Championship (1999)</h1>
    <p>Esecuzione nativa tramite WebAssembly & WebGL</p>
    
    <button class="btn-avvia" id="btnStart">AVVIA GIOCO</button>
    <div id="statusMessage" class="status">In attesa dell'avvio...</div>

    <div id="screen-container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <div class="controls">
        Fai clic nel riquadro per bloccare il mouse. Premi <b>Esc</b> per sbloccarlo.
    </div>

    <!-- Carichiamo il file di controllo locale -->
    <script src="boxedwine.js"></script>

    <script>
        const btnStart = document.getElementById('btnStart');
        const statusMessage = document.getElementById('statusMessage');

        btnStart.addEventListener('click', function() {
            btnStart.disabled = true;
            statusMessage.innerText = "Inizializzazione del motore e download del gioco (517 MB)...";

            // Sostituisci questo URL con il link REALE delle tue GitHub Releases
            const giocoUrl = "https://github.com";

            // Configurazione specifica per costringere il browser a interpretare correttamente i file locali su GitHub Pages
            var ConfigBoxedwine = {
                wasm_path: "boxedwine.wasm",
                root: "boxedwine.zip",
                canvas: document.getElementById("canvas"),
                app: giocoUrl,
                p: "d:/ral.exe",
                
                // Riduciamo leggermente l'allocazione iniziale della memoria per evitare che il browser
                // blocchi l'avvio prima del download dei file di gioco
                memory_size: 256 * 1024 * 1024, 
                vga_memory_size: 16 * 1024 * 1024,
                use_webgl: true,
                
                // Aggiungiamo un flag per dire al compilatore integrato di ignorare le restrizioni sui tipi MIME di GitHub
                isIOS: false, 
                isRunningInline: true,

                onLaunch: function() {
                    statusMessage.innerText = "Gioco avviato! Fai clic sullo schermo per giocare.";
                },
                onError: function(err) {
                    statusMessage.innerText = "Errore durante l'avvio: " + err;
                    btnStart.disabled = false;
                }
            };

            // Esecuzione forzata del modulo
            try {
                if (typeof Boxedwine !== "undefined") {
                    // Sovrascriviamo un parametro interno di sblocco prima di partire
                    window.BoxedwineConfig = ConfigBoxedwine;
                    Boxedwine.start(ConfigBoxedwine);
                } else {
                    statusMessage.innerText = "Errore critico: Modulo JavaScript non presente in memoria.";
                    btnStart.disabled = false;
                }
            } catch (e) {
                statusMessage.innerText = "Eccezione rilevata: " + e.message;
                btnStart.disabled = false;
            }
        });
    </script>
</body>
</html>
