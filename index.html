<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil 1 Rally Championship (1999) - Browser Edition v1.0.6</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { font-size: 22px; color: #00d2ff; margin-bottom: 5px; }
        p { color: #aaa; margin-top: 0; margin-bottom: 15px; font-size: 14px; }
        #screen-container {
            width: 800px;
            height: 600px;
            border: 5px solid #444;
            background: black;
            border-radius: 4px;
        }
        #canvas { display: block; width: 100%; height: 100%; }
        .btn-avvia {
            background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
            border: none;
            color: white;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 15px;
        }
        .btn-avvia:hover { transform: translateY(-2px); }
        .btn-avvia:disabled { background: #444; cursor: not-allowed; transform: none; }
        .controls { margin-top: 15px; font-size: 14px; color: #ccc; }
        .status { font-size: 13px; color: #00ffcc; margin-bottom: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <h1>🏁 La Mia Libreria: Mobil 1 Rally Championship (1999) - Build v1.0.6</h1>
    <p>Esecuzione nativa tramite WebAssembly & WebGL</p>
    
    <button class="btn-avvia" id="btnStart">AVVIA GIOCO</button>
    <div id="statusMessage" class="status">In attesa dell'avvio manuale...</div>

    <div id="screen-container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <div class="controls">
        Fai clic nel riquadro per bloccare il mouse. Premi <b>Esc</b> per sbloccarlo.
    </div>

    <script>
        // CONFIGURAZIONE GLOBALE PREVENTIVA: Definiamo i parametri prima del caricamento dello script
        // In questo modo forziamo boxedwine.js ad accettare la stringa intera senza spezzarla
        window.BoxedwineConfig = {
            wasm_path: "boxedwine.wasm",
            root: "boxedwine.zip",
            // INSERISCI QUI IL TUO URL DI GITHUB RELEASES REALE E COMPLETO
            app: "https://github.com",
            p: "d:/ral.exe",
            use_webgl: true
        };

        // Forziamo anche la mappatura dei moduli Emscripten in modo che ignorino i vecchi comandi predefiniti
        var Module = typeof Module !== "undefined" ? Module : {};
        Module.canvas = document.getElementById("canvas");
        Module.locateFile = function(path) {
            if (path.endsWith(".wasm")) return "boxedwine.wasm";
            return path;
        };
        Module.print = function(text) { console.log("Boxedwine Log: " + text); };
        Module.printErr = function(text) { console.error("Boxedwine Error: " + text); };
    </script>

    <!-- Carichiamo il file core JS locale dopo aver impostato la configurazione di sblocco globale -->
    <script src="boxedwine.js"></script>

    <script>
        const btnStart = document.getElementById('btnStart');
        const statusMessage = document.getElementById('statusMessage');

        // Spostiamo la logica di inizializzazione ed esecuzione al momento del click sul pulsante
        btnStart.addEventListener('click', function() {
            btnStart.disabled = true;
            statusMessage.innerText = "Sincronizzazione dei moduli ed estrazione in corso (517 MB)...";

            try {
                // Aggiorniamo il canvas agganciandolo dinamicamente all'elemento visivo prima dell'esecuzione
                Module.canvas = document.getElementById("canvas");
                
                if (typeof Boxedwine !== "undefined" && typeof Boxedwine.start === "function") {
                    Boxedwine.start(window.BoxedwineConfig);
                } else if (typeof Module.run === "function") {
                    Module.run();
                } else {
                    statusMessage.innerText = "Esecuzione forzata avviata. Monitora la console per i dettagli.";
                }
            } catch (e) {
                statusMessage.innerText = "Eccezione rilevata: " + e.message;
                btnStart.disabled = false;
            }
        });
    </script>
</body>
</html>
