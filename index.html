<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil 1 Rally Championship (1999) - Browser Edition</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { 
            font-size: 22px; 
            color: #00d2ff; 
            margin-bottom: 5px; 
        }
        p {
            color: #aaa;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 14px;
        }
        #screen-container {
            width: 800px;
            height: 600px;
            border: 5px solid #444;
            background: black;
            border-radius: 4px;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .btn-avvia {
            background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
            border: none;
            color: white;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 15px;
        }
        .btn-avvia:hover {
            transform: translateY(-2px);
        }
        .btn-avvia:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }
        .controls { 
            margin-top: 15px; 
            font-size: 14px; 
            color: #ccc; 
        }
        .status {
            font-size: 13px;
            color: #00ffcc;
            margin-bottom: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>🏁 La Mia Libreria: Mobil 1 Rally Championship (1999)</h1>
    <p>Esecuzione nativa tramite WebAssembly & WebGL</p>
    
    <button class="btn-avvia" id="btnStart">AVVIA GIOCO</button>
    <div id="statusMessage" class="status">In attesa dell'avvio...</div>

    <div id="screen-container">
        <!-- Canvas principale su cui il motore scriverà i dati video -->
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <div class="controls">
        Fai clic nel riquadro per bloccare il mouse. Premi <b>Esc</b> per sbloccarlo.
    </div>

    <!-- Carichiamo il file di controllo locale che hai appena caricato su GitHub -->
    <script src="boxedwine.js"></script>

    <script>
        const btnStart = document.getElementById('btnStart');
        const statusMessage = document.getElementById('statusMessage');

        btnStart.addEventListener('click', function() {
            btnStart.disabled = true;
            statusMessage.innerText = "Download di Mobil 1 Rally (517 MB) ed estrazione in corso...";

            // RICORDATI: Sostituisci questo URL con il link REALE delle tue GitHub Releases
            const giocoUrl = "https://github.com";

            var ConfigBoxedwine = {
                // Impostiamo i percorsi locali dei file che hai appena caricato nella cartella principale
                wasm_path: "boxedwine.wasm",
                root: "boxedwine.zip", 
                
                canvas: document.getElementById("canvas"),
                app: giocoUrl,
                p: "d:/ral.exe", // Avvia l'eseguibile corretto
                
                // Configurazione memoria per gestire il pacchetto da 517MB in RAM
                memory_size: 512 * 1024 * 1024, 
                vga_memory_size: 32 * 1024 * 1024,
                use_webgl: true, 
                
                onLaunch: function() {
                    statusMessage.innerText = "Gioco avviato! Fai clic sullo schermo per giocare.";
                },
                onError: function(err) {
                    statusMessage.innerText = "Errore durante l'avvio: " + err;
                    btnStart.disabled = false;
                }
            };

            // Avvio sicuro tramite il motore locale
            if (typeof Boxedwine !== "undefined") {
                Boxedwine.start(ConfigBoxedwine);
            } else {
                statusMessage.innerText = "Errore critico: Il file boxedwine.js non è stato caricato correttamente.";
                btnStart.disabled = false;
            }
        });
    </script>
</body>
</html>
