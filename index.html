<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil 1 Rally Championship (1999) - Browser Edition</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { font-size: 22px; color: #00d2ff; margin-bottom: 5px; }
        p { color: #aaa; margin-top: 0; margin-bottom: 15px; font-size: 14px; }
        #screen-container {
            width: 800px;
            height: 600px;
            border: 5px solid #444;
            background: black;
            border-radius: 4px;
        }
        #canvas { display: block; width: 100%; height: 100%; }
        .btn-avvia {
            background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
            border: none;
            color: white;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 15px;
        }
        .btn-avvia:hover { transform: translateY(-2px); }
        .btn-avvia:disabled { background: #444; cursor: not-allowed; transform: none; }
        .controls { margin-top: 15px; font-size: 14px; color: #ccc; }
        .status { font-size: 13px; color: #00ffcc; margin-bottom: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <h1>🏁 La Mia Libreria: Mobil 1 Rally Championship (1999)</h1>
    <p>Esecuzione nativa tramite WebAssembly & WebGL</p>
    
    <button class="btn-avvia" id="btnStart">AVVIA GIOCO</button>
    <div id="statusMessage" class="status">In attesa dell'avvio...</div>

    <div id="screen-container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <div class="controls">
        Fai clic nel riquadro per bloccare il mouse. Premi <b>Esc</b> per sbloccarlo.
    </div>

    <!-- SBLOCCO CRITICO: Iniettiamo l'architettura core di controllo direttamente in linea -->
    <script>
        // Inizializzazione globale richiesta dall'ambiente Emscripten di Boxedwine
        var Module = typeof Module !== "undefined" ? Module : {};
        
        // Struttura di sblocco e configurazione del runtime
        var Boxedwine = (function() {
            var initialized = false;
            return {
                start: function(config) {
                    if (initialized) return;
                    initialized = true;
                    
                    // Configurazione dei parametri minimi per agganciare il file WASM e l'output canvas
                    Module = {
                        canvas: config.canvas,
                        arguments: ["-root", "boxedwine.zip", "-app", config.app, config.p],
                        print: function(text) { console.log(text); },
                        printErr: function(text) { console.error(text); },
                        locateFile: function(path) {
                            if (path.endsWith(".wasm")) return config.wasm_path;
                            return path;
                        },
                        onRuntimeInitialized: function() {
                            if (config.onLaunch) config.onLaunch();
                        },
                        setStatus: function(text) {
                            console.log("Status: " + text);
                        }
                    };

                    // Caricamento asincrono dinamico del core binario per prevenire i blocchi MIME di GitHub
                    var scriptWasm = document.createElement("script");
                    // Sfruttiamo un caricatore asincrono standard compatibile con gl4es
                    scriptWasm.src = "https://jsdelivr.net";
                    scriptWasm.onerror = function() {
                        // Se il CDN fallisce, tenta l'esecuzione tramite la memoria interna allocata
                        var xhr = new XMLHttpRequest();
                        xhr.open("GET", config.wasm_path, true);
                        xhr.responseType = "arraybuffer";
                        xhr.onload = function() {
                            Module.wasmBinary = xhr.response;
                            var localScript = document.createElement("script");
                            localScript.src = "boxedwine.js";
                            document.body.appendChild(localScript);
                        };
                        xhr.send();
                    };
                    document.body.appendChild(scriptWasm);
                }
            };
        })();

        // Logica del pulsante di avvio
        const btnStart = document.getElementById('btnStart');
        const statusMessage = document.getElementById('statusMessage');

        btnStart.addEventListener('click', function() {
            btnStart.disabled = true;
            statusMessage.innerText = "Inizializzazione del motore e download del gioco (517 MB) in corso...";

            // MODIFICA QUI: Metti il link della tua release di GitHub al posto di questo esempio
            const giocoUrl = "https://github.com";

            var ConfigBoxedwine = {
                wasm_path: "boxedwine.wasm", // Legge il file locale caricato nella repository
                canvas: document.getElementById("canvas"),
                app: giocoUrl,
                p: "d:/ral.exe",
                
                onLaunch: function() {
                    statusMessage.innerText = "Gioco avviato! Fai clic sullo schermo per giocare.";
                }
            };

            // Eseguiamo il motore unificato
            try {
                Boxedwine.start(ConfigBoxedwine);
            } catch (e) {
                statusMessage.innerText = "Eccezione durante il caricamento: " + e.message;
                btnStart.disabled = false;
            }
        });
    </script>
</body>
</html>
